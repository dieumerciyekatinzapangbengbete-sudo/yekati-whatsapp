<!DOCTYPE html><html lang=fr><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>YEKATI</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:#111b21;color:#e9edef;height:100vh;overflow:hidden}.top{background:#202c33;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:20px}.tabs{display:flex;background:#202c33}.tabs div{flex:1;text-align:center;padding:13px 0;font-size:14px;color:#8696a0;border-bottom:3px solid transparent;cursor:pointer}.tabs.on{color:#00a884;border-color:#00a884}.search{padding:8px 12px}.search input{width:100%;background:#202c33;border:none;padding:10px 14px;border-radius:8px;color:#fff}.list{overflow-y:auto;height:calc(100vh - 110px)}.chat{padding:12px 14px;display:flex;gap:12px;border-bottom:1px solid #222d34;cursor:pointer}.chat:active{background:#202c33}.av{width:49px;height:49px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;flex-shrink:0}.nm{font-size:17px}.tm{font-size:12px;color:#8696a0;float:right}.lm{font-size:13px;color:#8696a0;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fab{position:fixed;bottom:22px;right:22px;width:56px;height:56px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.chatWin{position:fixed;inset:0;background:#0b141a;display:none;flex-direction:column;z-index:20}.mh{background:#202c33;padding:10px 12px;display:flex;align-items:center;gap:10px}.msgs{flex:1;overflow-y:auto;padding:10px;background:#0b141a}.bub{max-width:75%;padding:8px 10px;border-radius:8px;margin:5px 0;font-size:14px}.me{background:#005c4b;margin-left:auto}.ot{background:#202c33}.inp{background:#202c33;padding:8px;display:flex;gap:8px;align-items:center}.inp input{flex:1;background:#2a3942;border:none;padding:11px 14px;border-radius:21px;color:#fff}.btn{font-size:22px;cursor:pointer}.callPage{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}.hide{display:none!important}</style></head><body><div class=top><h1>YEKATI</h1><div><span onclick=addContact() style=font-size:24px;cursor:pointer>+</span><span style=margin-left:16px>⋮</span></div></div><div class=tabs><div id=t1 class=on onclick=tab(1)>DISC.</div><div id=t2 onclick=tab(2)>ACTUS</div><div id=t3 onclick=tab(3)>COMMUN.</div><div id=t4 onclick=tab(4)>APPELS</div></div><div class=search><input placeholder=Rechercher...></div><div id=p1 class=list></div><div id=p2 class="list hide"><div style=padding:20px><b>Actus (Statut)</b><br><br><div onclick=addStat() style=display:flex;gap:12px;cursor:pointer><div class=av style=border:2px solid #00a884>M</div><div>Mon statut<br><small style=color:#8696a0>Appuyer pour ajouter</small></div></div><div id=statList style=margin-top:20px></div></div></div><div id=p3 class="list hide"><center style=padding:40px;color:#8696a0>Communautés bientôt</center></div><div id=p4 class="list hide"></div><div class=fab onclick=addContact()>+</div><div id=chatWin class=chatWin><div class=mh><span onclick=closeChat() style=cursor:pointer;font-size:22px>←</span><div class=av id=mAv>F</div><div><b id=mNm>Famille</b><br><small style=color:#00a884>en ligne</small></div><div style=margin-left:auto;display:flex;gap:14px><span class=btn onclick=startCall(false)>📞</span><span class=btn onclick=startCall(true)>📹</span></div></div><div id=msgs class=msgs></div><div class=inp><span class=btn>😊</span><input id=txt placeholder=Message oninput=onType() onkeydown="if(event.key=='Enter')send()"><span id=mic class=btn onclick=doVoice()>🎤</span><span id=send class="btn hide" onclick=send()>➤</span></div></div><div id=callPage class=callPage><div style=padding:14px;background:#202c33;display:flex;justify-content:space-between><span id=callName>Appel</span><span onclick=endCall() style=cursor:pointer>✕</span></div><div style=flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111><video id=localV autoplay muted playsinline style=width:100%;height:100%;object-fit:cover;display:none></video><div id=callInfo style=font-size:18px>Appel vocal...</div><video id=smallV autoplay playsinline style=position:absolute;width:110px;height:150px;right:12px;top:70px;border-radius:12px;border:2px solid #00a884;display:none></video></div><div style=padding:24px;background:#202c33;display:flex;justify-content:center;gap:24px><span style=width:56px;height:56px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;cursor:pointer>🎤</span><span style=width:56px;height:56px;border-radius:50%;background:#f15c6d;display:flex;align-items:center;justify-content:center;cursor:pointer onclick=endCall()>📞</span><span style=width:56px;height:56px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;cursor:pointer>📹</span></div></div><script>let chats=JSON.parse(localStorage.YK_CHATS||'[{"n":"Famille","p":"F","m":"On mange à 20h ce soir?","t":"Hier","a":"audio"},{"n":"Travail","p":"T","m":"Le rapport est envoyé","t":"10:42","a":"check"},{"n":"Amis","p":"A","m":"Photo au parc dimanche!","t":"09:15","a":""}]'),stats=JSON.parse(localStorage.YK_STAT||'[]'),calls=JSON.parse(localStorage.YK_CALL||'[]'),cur=chats[0],rec,chunks,streamCall;function render(){let h="";chats.forEach((c,i)=>{h+=`<div class=chat onclick="openChat(${i})"><div class=av>${c.p}</div><div style=flex:1;overflow:hidden><div><span class=nm>${c.n}</span><span class=tm>${c.t}</span></div><div class=lm>${c.m} ${c.a=="audio"?"🎤":""} ${c.a=="check"?"✓✓":""}</div></div></div>`});document.getElementById('p1').innerHTML=h;let ch="";calls.forEach(cl=>{ch+=`<div class=chat><div class=av>${cl.p}</div><div style=flex:1><b>${cl.n}</b><br><small style=color:#8696a0>${cl.t} • ${cl.ty}</small></div><span onclick="startCall(${cl.ty=='video'},'${cl.n}')" style=cursor:pointer>📞</span></div>`});document.getElementById('p4').innerHTML=ch||'<center style=padding:30px;color:#8696a0>Aucun appel</center>';let st="";stats.forEach(s=>{st+=`<div class=chat><div class=av style=border:2px solid #00a884>${s.p}</div><div><b>${s.n}</b><br><small style=color:#8696a0>${s.t}</small><div style=margin-top:6px>${s.txt}</div></div></div>`});document.getElementById('statList').innerHTML=st}function tab(n){document.querySelectorAll('.tabs div').forEach(e=>e.classList.remove('on'));document.getElementById('t'+n).classList.add('on');[1,2,3,4].forEach(i=>document.getElementById('p'+i).classList.toggle('hide',i!=n))}function openChat(i){cur=chats[i];document.getElementById('mNm').textContent=cur.n;document.getElementById('mAv').textContent=cur.p;document.getElementById('msgs').innerHTML=`<div class="bub ot">Salut! Bienvenue dans ${cur.n}</div><div class="bub ot">${cur.m}</div>`;document.getElementById('chatWin').style.display='flex'}function closeChat(){document.getElementById('chatWin').style.display='none'}function addContact(){let n=prompt('Nom du contact:');if(!n)return;let num=prompt('Numéro (ex: +243 8XX...):')||'';chats.unshift({n,p:n[0].toUpperCase(),m:num||'Nouveau contact',t:'maintenant',a:''});localStorage.YK_CHATS=JSON.stringify(chats);render()}function onType(){let has=document.getElementById('txt').value.trim().length>0;document.getElementById('mic').classList.toggle('hide',has);document.getElementById('send').classList.toggle('hide',!has)}function send(){let v=document.getElementById('txt').value.trim();if(!v)return;let d=document.createElement('div');d.className='bub me';d.textContent=v;document.getElementById('msgs').appendChild(d);cur.m=v;cur.t='maintenant';localStorage.YK_CHATS=JSON.stringify(chats);document.getElementById('txt').value='';onType();render();document.getElementById('msgs').scrollTop=9999}async function doVoice(){if(rec&&rec.state=='recording'){rec.stop();return}try{let s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let b=new Blob(chunks);let u=URL.createObjectURL(b);let div=document.createElement('div');div.className='bub me';div.innerHTML=`<audio controls src=${u}></audio>`;document.getElementById('msgs').appendChild(div);s.getTracks().forEach(t=>t.stop())};rec.start();alert('🎤 Enregistrement... reclique micro pour envoyer')}catch(e){alert(e.message)}}function addStat(){let t=prompt('Ton statut (texte):');if(!t)return;stats.unshift({n:'Moi',p:'M',t:'maintenant',txt:t});localStorage.YK_STAT=JSON.stringify(stats);render();tab(2)}async function startCall(video,name){let nm=name||cur.n;document.getElementById('callName').textContent=nm;document.getElementById('callInfo').textContent=video?'Appel vidéo...':'Appel vocal...';document.getElementById('callPage').style.display='flex';try{streamCall=await navigator.mediaDevices.getUserMedia({audio:true,video:video});document.getElementById('localV').srcObject=streamCall;document.getElementById('localV').style.display=video?'block':'none';document.getElementById('smallV').style.display=video?'block':'none';if(video){let cam=await navigator.mediaDevices.getUserMedia({video:true});document.getElementById('smallV').srcObject=cam}}catch(e){}calls.unshift({n:nm,p:nm[0],t:new Date().toLocaleTimeString(),ty:video?'video':'vocal'});localStorage.YK_CALL=JSON.stringify(calls);render()}function endCall(){if(streamCall)streamCall.getTracks().forEach(t=>t.stop());document.getElementById('callPage').style.display='none';document.getElementById('localV').srcObject=null}render();</script></body></html>
