<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yekati - Messagerie</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f0f2f5; }
        #app-container { display: flex; width: 100%; height: 100%; background: #fff; }
        
        /* Barre latérale (Contacts) */
        #sidebar { width: 30%; border-right: 1px solid #ddd; background: #fff; display: flex; flex-direction: column; }
        #user-profile { padding: 20px; background: #ededed; font-weight: bold; font-size: 1.1em; border-bottom: 1px solid #ddd; }
        #chat-list { flex: 1; overflow-y: auto; list-style: none; }
        .chat-item { padding: 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; transition: 0.3s; }
        .chat-item:hover { background: #f5f6f6; }
        .chat-item.active { background: #ebebeb; }

        /* Zone de discussion principale */
        #chat-area { width: 70%; display: flex; flex-direction: column; background: #efeae2; }
        #chat-header { padding: 15px 20px; background: #ededed; font-weight: bold; border-bottom: 1px solid #ddd; }
        #messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Bulles de messages style WhatsApp */
        .message { max-width: 60%; padding: 10px 15px; border-radius: 8px; font-size: 0.95em; position: relative; word-wrap: break-word; }
        .message.sent { background: #d9fdd3; align-self: flex-end; }
        .message.received { background: #ffffff; align-self: flex-start; }
        .message .time { font-size: 0.75em; color: #667781; margin-top: 5px; text-align: right; display: block; }

        /* Zone de saisie du texte */
        #input-area { padding: 10px 20px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; }
        #message-input { flex: 1; padding: 12px; border: none; border-radius: 8px; outline: none; font-size: 1em; }
        #send-btn { padding: 12px 25px; background: #00a884; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #send-btn:hover { background: #008f72; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Barre latérale -->
        <div id="sidebar">
            <div id="user-profile">Mon Profil Yekati</div>
            <ul id="chat-list">
                <li class="chat-item active" onclick="selectChat('salon_general')">💬 Salon Général (Test)</li>
            </ul>
        </div>

        <!-- Zone des discussions -->
        <div id="chat-area">
            <div id="chat-header">Discussions en temps réel</div>
            <div id="messages-container" id="messages"></div>
            
            <!-- Formulaire d'envoi -->
            <form id="input-area" onsubmit="handleSendMessage(event)">
                <input type="text" id="message-input" placeholder="Tapez un message..." required autocomplete="off">
                <button type="submit" id="send-btn">Envoyer</button>
            </form>
        </div>
    </div>
