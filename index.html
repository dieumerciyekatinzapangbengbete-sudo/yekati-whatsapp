        }

        .app-container {

            flex-direction: column;
            background-color: #ffffff;
        }

        .sidebar-header {

            display: flex;

            padding: 0 16px;
            justify-content: space-between;
        }

            height: 40px;
            border-radius: 50%;
            background-color: #00bfa5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .search-container {
            padding: 8px;
            background-color: #f6f6f6;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            background-color: #ffffff;
            outline: none;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            padding: 12px 16px;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #f2f2f2;
        }

        .chat-item:hover {
            background-color: #f5f5f5;
        }

        .chat-details {
            margin-left: 15px;
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            font-size: 16px;
            color: #111;
        }

        /* Zone principale droite (Messages) */
        .main-chat {
            width: 70%;
            display: flex;
            flex-direction: column;
            background-color: #efeae2;
            position: relative;
        }

        .chat-header {
            height: 60px;
            background-color: #eeeeee;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .messages-container {
            flex: 1;
            padding: 20px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 60%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            position: relative;
            line-height: 19px;
            word-wrap: break-word;
        }

        .message.sent {
            background-color: #d9fdd3;
            align-self: flex-end;
        }

        .message.received {
            background-color: #ffffff;
            align-self: flex-start;
        }

        .message-time {
            font-size: 10px;
            color: #667781;
            text-align: right;
            margin-top: 4px;
