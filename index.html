<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yekati - Messagerie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #d1d7db;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 1000px;
            height: 95vh;
            background-color: #efeae2;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Entête style WhatsApp */
        header {
            background-color: #008069;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        header .status {
            font-size: 12px;
            font-weight: normal;
            margin-left: 10px;
            color: #d1f4cc;
        }

        /* Zone d'affichage des messages */
        #zone-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: url('https://githubusercontent.com');
            background-opacity: 0.4;
        }

        /* Bulles de discussion */
        .message {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .envoye {
            background-color: #d9fdd3;
            align-self: flex-end;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        .recu {
            background-color: #ffffff;
            align-self: flex-start;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        /* Barre d'envoi en bas */
        footer {
            background-color: #f0f2f5;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #input-message {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: white;
        }

        #btn-envoyer {
            background-color: #008069;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        #btn-envoyer:hover {
            background-color: #006653;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Barre du haut -->
    <header>
        <div>Yekati Chat</div>
        <div class="status">● En ligne (Firebase connecté)</div>
    </header>

    <!-- Zone de discussion -->
    <div id="zone-messages" id="zone-messages"></div>

    <!-- Barre de saisie -->
    <footer>
        <input type="text" id="input-message" placeholder="Tapez un message..." autocomplete="off">
        <button id="btn-envoyer">Envoyer</button>
    </footer>
</div>

<!-- Scripts Firebase de base et Firestore -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
  // 1. Configuration Firebase de l'application Yekati
  // REMPLACEZ LES VALEURS CI-DESSOUS PAR VOS NOUVELLES CLÉS SÉCURISÉES DE LA CONSOLE
  const firebaseConfig = {
    apiKey: "VOTRE_NOUVELLE_CLE_API",
    authDomain: "://firebaseapp.com",
    projectId: "yekati-whatsapp",
    storageBucket: "://appspot.com",
    messagingSenderId: "VOTRE_MESSAGING_SENDER_ID",
    appId: "VOTRE_APP_ID"
  };

  // Initialisation du projet Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Identifiant temporaire pour simuler votre compte (Dieu Merci)
  const monIdUtilisateur = "DieuMerci_Yekatinzapa";

  // Sélection des éléments HTML
  const zoneMessages = document.getElementById("zone-messages");
  const inputMessage = document.getElementById("input-message");
  const btnEnvoyer = document.getElementById("btn-envoyer");

  // 2. Fonction pour ENVOYER un message à Firestore
  function envoyerNouveauMessage() {
    const texte = inputMessage.value.trim();
    if (texte === "") return; // Ne rien faire si le champ est vide

    db.collection("messages").add({
      texte: texte,
      expediteur: monIdUtilisateur,
      dateEnvoi: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
      inputMessage.value = ""; // Vider le champ de saisie
      inputMessage.focus();
    })
    .catch((error) => {
      console.error("Erreur d'écriture Firebase : ", error);
      alert("Erreur de permission Firestore. Vérifiez vos règles d'accès.");
    });
  }

  // Événements d'envoi (Clic sur le bouton ou appui sur la touche Entrée)
  btnEnvoyer.addEventListener("click", envoyerNouveauMessage);
  inputMessage.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      envoyerNouveauMessage();
    }
  });

  // 3. ÉCOUTE et Synchronisation en temps réel de la base de données
  db.collection("messages")
    .orderBy("dateEnvoi", "asc")
    .onSnapshot((snapshot) => {
      // Vider la zone visuelle pour réafficher proprement la liste triée
      zoneMessages.innerHTML = "";
      
      snapshot.forEach((doc) => {
        const messageData = doc.data();
        
        // Création de la bulle HTML
        const bulleElement = document.createElement("div");
        bulleElement.classList.add("message");
        
        // Si l'expéditeur est l'utilisateur actuel -> bulle verte à droite
        if (messageData.expediteur === monIdUtilisateur) {
            bulleElement.classList.add("envoye");
        } else {
            // Sinon -> bulle blanche à gauche
            bulleElement.classList.add("recu");
        }
        
        bulleElement.textContent = messageData.texte;
        zoneMessages.appendChild(bulleElement);
      });
      
      // Faire défiler automatiquement vers le bas pour voir le dernier message
      zoneMessages.scrollTop = zoneMessages.scrollHeight;
    }, (error) => {
        console.error("Erreur d'écoute en temps réel : ", error);
    });
</script>

</body>
</html>
