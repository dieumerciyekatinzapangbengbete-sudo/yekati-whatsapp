<!DOCTYPE html><html lang=fr><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1"><title>YEKATI WhatsApp</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Roboto,Arial;background:#111b21;color:#e9edef;height:100vh;overflow:hidden}.app{display:flex;height:100vh}.side{width:100%;max-width:430px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}.top{background:#202c33;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:19px;font-weight:500}.top i{margin-left:20px;font-style:normal;cursor:pointer}.tabs{display:flex;background:#202c33}.tabs div{flex:1;text-align:center;padding:14px 0;font-size:14px;color:#8696a0;border-bottom:3px solid transparent;cursor:pointer}.tabs.on{color:#00a884;border-bottom-color:#00a884}.srch{background:#111b21;padding:7px 12px}.srch input{width:100%;background:#202c33;border:none;padding:10px 14px;border-radius:8px;color:#fff}.list{flex:1;overflow-y:auto}.chat{padding:12px 14px;display:flex;gap:12px;border-bottom:1px solid #222d34;cursor:pointer}.chat:hover{background:#202c33}.av{width:49px;height:49px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;flex-shrink:0}.md{flex:1;overflow:hidden}.rw{display:flex;justify-content:space-between}.nm{font-size:17px;font-weight:400}.tm{font-size:12px;color:#8696a0}.lm{font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;z-index:10}.main{flex:1;background:#0b141a;display:flex;flex-direction:column;position:relative}.mh{background:#202c33;padding:10px 14px;display:flex;align-items:center;gap:12px}.bk{cursor:pointer;font-size:20px}.mi{flex:1}.mi b{font-size:16px}.mi small{font-size:13px;color:#8696a0}.call{font-size:20px;margin-left:12px;cursor:pointer}.msg{flex:1;overflow-y:auto;padding:12px;background:url('https://user-images.githubusercontent.com/15075759/28754037-9f4c91de-7589-11e7-9da8-3d2b6a8a9fa7.png');background-color:#0b141a}.bub{max-width:75%;padding:8px 10px;border-radius:8px;margin:4px 0;font-size:14.2px;line-height:19px;position:relative}.me{background:#005c4b;margin-left:auto;border-top-right-radius:0}.ot{background:#202c33;border-top-left-radius:0}.inp{background:#202c33;padding:8px 10px;display:flex;align-items:center;gap:8px}.inp input{flex:1;background:#2a3942;border:none;padding:11px 14px;border-radius:21px;color:#fff;font-size:15px}.ic{font-size:22px;cursor:pointer}.hide{display:none!important}#stat,#calls{padding:14px}.st{padding:12px 0;display:flex;gap:12px;border-bottom:1px solid #222}.st.av{border:2px solid #00a884}#vcall{position:fixed;inset:0;background:#000;z-index:99;display:none;flex-direction:column}.vtop{padding:14px;background:#202c33;display:flex;justify-content:space-between}.vvid{flex:1;background:#111;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:cover}.vbot{padding:20px;background:#202c33;display:flex;justify-content:center;gap:20px}.vbot span{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px}.end{background:#f15c6d}</style><body><div class=app><div class=side id=side><div class=top><h1>YEKATI</h1><div><i onclick=addC()>+</i><i>⋮</i></div></div><div class=tabs><div id=t1 class=on onclick="sw(1)">DISC.</div><div id=t2 onclick="sw(2)">ACTUS</div><div id=t3 onclick="sw(3)">COMMUN.</div><div id=t4 onclick="sw(4)">APPELS</div></div><div class=srch><input placeholder="Rechercher..."></div><div class=list id=chats></div><div class=list hide id=stat><div class=st><div class=av>M</div><div><b>Mon statut</b><br><small>Appuyer pour ajouter</small></div></div><div id=stList></div></div><div class=list hide id=calls></div><div class=fab onclick=addC()>+</div></div><div class=main id=main><div class=mh><span class=bk onclick="document.getElementById('side').style.display='flex';document.getElementById('main').style.display='none'">←</span><div class=av id=mAv>F</div><div class=mi><b id=mNm>Famille</b><br><small id=mSt>en ligne</small></div><span class=call onclick="startCall(0)">📞</span><span class=call onclick="startCall(1)">📹</span><span class=call>⋮</span></div><div class=msg id=msgs></div><div class=inp><span class=ic>😊</span><span class=ic>📎</span><input id=txt placeholder="Message" onkeydown="if(event.key=='Enter')send()"><span class=ic id=mic onclick=rec()>🎤</span><span class=ic hide id=snd onclick=send()>➤</span></div></div></div><div id=vcall><div class=vtop><span id=vName>Appel</span><span onclick=endCall()>✕</span></div><div class=vvid><video id=lv autoplay muted playsinline></video><video id=rv autoplay playsinline style=position:absolute;width:100px;height:130px;right:10px;top:70px;border-radius:10px;border:2px solid #00a884></video><div id=vInfo>Appel vocal...</div></div><div class=vbot><span style=background:#333 onclick="mut()">🎤</span><span class=end onclick=endCall()>📞</span><span style=background:#333 onclick="swCam()">📹</span></div></div><script>let D=JSON.parse(localStorage.yd||'[{"n":"Famille","p":"F","m":"Salut la famille!","t":"06:55","u":2},{"n":"Travail","p":"T","m":"Reunion a 14h","t":"05:30","u":0},{"n":"Amis","p":"A","m":"On sort ce soir?","t":"Hier","u":1}]'),S=JSON.parse(localStorage.ys||'[]'),C=JSON.parse(localStorage.yc||'[]'),cur=D[0],MR,CH,TI,RS,LV;const $=s=>document.getElementById(s);function render(){let h='';D.forEach((d,i)=>h+=`<div class=chat onclick="openC(${i})"><div class=av>${d.p}</div><div class=md><div class=rw><span class=nm>${d.n}</span><span class=tm>${d.t}</span></div><div class=lm>${d.m}</div></div></div>`);$('chats').innerHTML=h;let ch='';C.forEach(c=>ch+=`<div class=st><div class=av>${c.p}</div><div><b>${c.n}</b><br><small>${c.t} • ${c.ty}</small></div><span style=margin-left:auto;cursor:pointer;font-size:20px' onclick="startCall(${c.ty=='video'?1:0},'${c.n}')">📞</span></div>`);$('calls').innerHTML=ch||'<center style=padding:30px;color:#8696a0>Aucun appel</center>';let sh='';S.forEach(s=>sh+=`<div class=st><div class=av>${s.p}</div><div><b>${s.n}</b><br><small>${s.t}</small></div></div>`);$('stList').innerHTML=sh}function sw(n){document.querySelectorAll('.tabs div').forEach(e=>e.classList.remove('on'));$('t'+n).classList.add('on');$('chats').classList.toggle('hide',n!=1);$('stat').classList.toggle('hide',n!=2);$('calls').classList.toggle('hide',n!=4)}function openC(i){cur=D[i];$('mNm').textContent=cur.n;$('mAv').textContent=cur.p;$('msgs').innerHTML=`<div class=bub ot>Bienvenue dans ${cur.n}</div><div class=bub ot>${cur.m}</div>`;if(window.innerWidth<800){$('side').style.display='none';$('main').style.display='flex'}}function addC(){let n=prompt('Nom du contact / groupe:');if(!n)return;let num=prompt('Numéro (ex: +243...)');D.unshift({n,p:n[0].toUpperCase(),m:num||'Nouveau contact',t:'maintenant',u:0});localStorage.yd=JSON.stringify(D);render()}function send(){let v=$('txt').value.trim();if(!v)return;let d=document.createElement('div');d.className='bub me';d.textContent=v;$('msgs').appendChild(d);$('txt').value='';cur.m=v;cur.t='maintenant';localStorage.yd=JSON.stringify(D);render();$('msgs').scrollTop=9999}function openStatus(){let t=prompt('Ton statut:');if(!t)return;S.unshift({n:'Moi',p:'M',t:'maintenant',txt:t});localStorage.ys=JSON.stringify(S);render()}async function rec(){if(MR&&MR.state=='recording'){MR.stop();return}try{let s=await navigator.mediaDevices.getUserMedia({audio:true});CH=[];MR=new MediaRecorder(s);MR.ondataavailable=e=>CH.push(e.data);MR.onstop=()=>{let u=URL.createObjectURL(new Blob(CH)),b=document.createElement('div');b.className='bub me';b.innerHTML=`<audio controls src=${u}></audio>`;$('msgs').appendChild(b);s.getTracks().forEach(t=>t.stop())};MR.start();alert('Enregistrement... reclique micro pour envoyer')}catch(e){alert(e.message)}}async function startCall(v,name){let nm=name||cur.n;$('vcall').style.display='flex';$('vName').textContent=nm;$('vInfo').textContent=v?'Appel vidéo...':'Appel vocal...';try{let m=await navigator.mediaDevices.getUserMedia({audio:true,video:v?true:false});LV=m;$('lv').srcObject=m;if(v){let r=await navigator.mediaDevices.getUserMedia({video:true});$('rv').srcObject=r}}catch(e){}C.unshift({n:nm,p:nm[0],t:new Date().toLocaleTimeString(),ty:v?'video':'vocal'});localStorage.yc=JSON.stringify(C);render()}function endCall(){if(LV)LV.getTracks().forEach(t=>t.stop());$('vcall').style.display='none';$('lv').srcObject=null;$('rv').srcObject=null}function mut(){alert('Micro coupé')}function swCam(){alert('Caméra changée')}document.getElementById('txt').addEventListener('input',e=>{let has=e.target.value.trim();document.getElementById('mic').classList.toggle('hide',has);document.getElementById('snd').classList.toggle('hide',!has)});$('stat').addEventListener('click',openStatus);render();openC(0);if(window.innerWidth>=800){$('main').style.display='flex'}else{$('main').style.display='none'}</script>
