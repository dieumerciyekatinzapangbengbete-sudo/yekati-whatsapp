<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>YEKATI - WhatsApp Business RDC</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#111b21;display:flex;height:100vh}.sidebar{width:35%;background:#fff;display:flex;flex-direction:column}.topbar{background:#f0f2f5;padding:12px;font-weight:800;color:#128C7E}.chats{flex:1;overflow-y:auto}.chat-item{padding:12px;border-bottom:1px solid #eee;display:flex;gap:10px;cursor:pointer}.avatar{width:40px;height:40px;border-radius:50%;background:#128C7E;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}.main{flex:1;background:#efeae2;display:flex;flex-direction:column}.messages{flex:1;padding:15px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}.bubble{max-width:70%;padding:8px 12px;border-radius:8px}.me{background:#d9fdd3;align-self:flex-end}.other{background:#fff;align-self:flex-start}.inputbar{background:#f0f2f5;padding:8px;display:flex;gap:8px}.inputbar input{flex:1;padding:10px;border-radius:8px;border:none}.btn{background:#128C7E;color:#fff;border:none;padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer}.login{position:fixed;inset:0;background:#111b21;display:flex;align-items:center;justify-content:center;z-index:99}.loginbox{background:#fff;padding:25px;border-radius:12px;width:90%;max-width:350px;text-align:center}.loginbox input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px}</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2 style="color:#128C7E">YEKATI</h2><p>Business RDC</p><input id="n" placeholder="Ton nom"><button class="btn" style="width:100%;margin-top:10px" onclick="document.getElementById('login').style.display='none';document.getElementById('me').innerText=document.getElementById('n').value[0]">Entrer</button></div></div>
<div class="sidebar"><div class="topbar">YEKATI BUSINESS <span id="me" class="avatar" style="float:right;width:30px;height:30px;font-size:14px">Y</span></div><div class="chats" id="list"></div><button class="btn" style="margin:8px;background:#000" onclick="addC()">+ Nouveau Client</button></div>
<div class="main"><div class="messages" id="msgs"></div><div class="inputbar"><input id="inp" placeholder="Message" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Envoyer</button></div></div>
<script>let clients=[{id:1,name:"Maman Bijou",last:"Merci!",a:"MB"},{id:2,name:"Client Kinshasa",last:"Livraison?",a:"CK"},{id:3,name:"YEKATI Support",last:"Bienvenue!",a:"YS"}];let store={1:[{m:0,t:"Bonjour commande 5 pagnes"},{m:1,t:"Disponible 25000 FC"}],3:[{m:0,t:"Bienvenue Maître sur YEKATI WhatsApp!"}]};let cur=1;function render(){let l=document.getElementById('list');l.innerHTML="";clients.forEach(c=>{let d=document.createElement('div');d.className='chat-item';d.innerHTML=`<div class=avatar>${c.a}</div><div><b>${c.name}</b><div style='font-size:12px;color:#666'>${c.last}</div></div>`;d.onclick=()=>{cur=c.id;show()};l.appendChild(d)});show()}function show(){let b=document.getElementById('msgs');b.innerHTML="";(store[cur]||[]).forEach(x=>{let d=document.createElement('div');d.className='bubble '+(x.m?'me':'other');d.innerText=x.t;b.appendChild(d)});b.scrollTop=9999}function send(){let i=document.getElementById('inp');if(!i.value)return;if(!store[cur])store[cur]=[];store[cur].push({m:1,t:i.value});i.value="";show();setTimeout(()=>{store[cur].push({m:0,t:"✅ Reçu! Réponse auto YEKATI"});show()},800)}function addC(){let n=prompt("Nom client:");if(!n)return;let id=Date.now();clients.unshift({id,name:n,last:"Nouveau",a:n.slice(0,2).toUpperCase()});store[id]=[];cur=id;render()}render()</script></body></html>
