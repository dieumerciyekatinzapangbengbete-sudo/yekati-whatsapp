<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yekati - Messagerie</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #dadbd4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-container { display: flex; width: 1396px; max-width: 100%; height: 95vh; background-color: #ededed; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
        .sidebar { width: 30%; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; background-color: #ffffff; }
        .sidebar-header { height: 60px; background-color: #eeeeee; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #00bfa5; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .search-container { padding: 8px; background-color: #f6f6f6; }
        .search-box { width: 100%; padding: 8px 12px; border: none; border-radius: 20px; outline: none; }
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; padding: 12px 16px; align-items: center; cursor: pointer; border-bottom: 1px solid #f2f2f2; }
        .chat-details { margin-left: 15px; flex: 1; }
        .chat-name { font-weight: 600; font-size: 16px; }
        .main-chat { width: 70%; display: flex; flex-direction: column; background-color: #efeae2; }
        .chat-header { height: 60px; background-color: #eeeeee; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e0e0e0; }
        .messages-container { flex: 1; padding: 20px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 19px; word-wrap: break-word; }
        .message.sent { background-color: #d9fdd3; align-self: flex-end; }
        .message.received { background-color: #ffffff; align-self: flex-start; }
        .message-time { font-size: 10px; color: #667781; text-align: right; margin-top: 4px; }
        .input-container { height: 62px; background-color: #f0f2f5; display: flex; align-items: center; padding: 5px 10px; gap: 10px; }
        .message-input { flex: 1; height: 42px; padding: 10px 15px; border: none; border-radius: 8px; outline: none; font-size: 15px; }
        .send-btn { background: none; border: none; color: #54656f; cursor: pointer; }
    </style>
</head>

                </div>

        </div>

                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
